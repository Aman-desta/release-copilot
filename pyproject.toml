[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "release-copilot"
version = "0.1.0"
description = "Multi-agent LangGraph release automation over Jira, GitHub, Azure, SonarQube and ServiceNow."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "openai>=1.50",
    "numpy>=2.4.6",
    "langgraph>=1.2.19",
    "langchain>=1.4.8",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "openinference-instrumentation-langchain>=0.1.82",
    "openinference-semantic-conventions>=0.1.43",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
# The mocks are a test dependency only: tests run them in-process through httpx.ASGITransport.
dev = ["pytest>=8", "pytest-asyncio>=0.23", "release-copilot-mocks"]

[tool.uv.sources]
release-copilot-mocks = { path = "../release-copilot-mocks", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
